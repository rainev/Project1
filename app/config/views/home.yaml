id: home
route: /
navOrder: 1
nav: Home
title: Farm Ops
description: >-
  Seed-to-harvest tracking for a hydroponic lettuce farm: batches, the day's
  tasks and the numbers behind the dashboard.
anonymous: true
node:
  type: PageShell
  props:
    title: Every batch, from seed to [[harvest.]]
    eyebrow: Farm Ops
    eyebrowVariant: pill
    subtitle: >-
      Seeding, the germination check, transplant and harvest for each batch of
      lettuce, and the numbers the dashboard is built from.
    actions:
      - label: Sign in
        href: /login
        emphasis: primary
  children:
    - type: Navigation
    - type: ContentCards
      props:
        eyebrow: The cycle
        heading: One batch, four steps
        columns: 2
        items:
          - title: Seed — Wednesday
            body: Sow the cells in the nursery and pick the area the batch will grow in.
          - title: Check — day 3
            body: Count the cells that germinated and re-seed the gaps in the same cell.
          - title: Transplant — day 17
            body: Move the plants to their area in the greenhouse, two weeks after the check.
          - title: Harvest — day 45 to 47
            body: One cut, 28 to 30 days after transplant, recorded by weight.
