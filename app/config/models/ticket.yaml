# A ticket assigned to a colleague — the relation this kit could not declare
# before `user` became a model an application may read.
#
# `agentId` points at the ACCOUNT, not at a copy of one. The grid resolves the
# label through the same gates as any other relation, so a ticket never shows a
# name its reader may not see.
$schema: https://json-schema.org/draft/2020-12/schema
$id: ticket
title: Ticket
type: object
properties:
  subject:
    type: string
    minLength: 1
    maxLength: 160
  agentId:
    type: string
    x-lookup:
      model: user
      label: email
x-storage:
  table: tickets
  notNull: [subject]
x-require:
  create: [subject]
x-query:
  sortable: [subject, createdAt]
  filterable: [subject, agentId]
x-access:
  read: "'staff' in actor.roles || 'admin' in actor.roles"
  write: "'staff' in actor.roles || 'admin' in actor.roles"
x-scope:
  orgId: actor.orgId
